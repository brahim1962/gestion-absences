<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion de la classe</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #123;
  }

  .header {
    background: #1f76b5;
    color: white;
    padding: 28px 20px;
  }

  .header-content {
    max-width: 900px;
    margin: auto;
  }

  .header a {
    color: white;
    text-decoration: none;
  }

  .header h1 {
    margin: 14px 0 6px;
    font-size: 32px;
  }

  .header p {
    margin: 0;
    font-size: 16px;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 22px 20px;
  }
   #studentsList > div {
  background: white;
  border: 1px solid #d6e2ec;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
} 
 #studentsList > div {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.student-actions {
  display: flex;
  gap: 6px;
}

.student-actions button {
  padding: 6px 9px;
  border: 1px solid #c9d6e2;
  border-radius: 6px;
  background: #f7f9fb;
  cursor: pointer;
  font-size: 13px;
} 
  @media (max-width: 700px) {
  #studentsList > div {
    flex-direction: column;
    align-items: stretch;
  }

  .student-actions {
    width: 100%;
    justify-content: space-between;
  }

  .student-actions button {
    flex: 1;
    font-size: 14px;
    padding: 8px 6px;
  }
}  
</style>
</head>

<body>
<script>
  const SUPABASE_URL = "https://gtbbrvtpesyumnhyfsrh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LZzN6nKGCPx2c9RLqyZBKA_rhN_mE_3";
  const profAccessToken = sessionStorage.getItem("prof_access_token");
  const profRefreshToken = sessionStorage.getItem("prof_refresh_token");

  if (!profAccessToken || !profRefreshToken) {
    window.location.href = "connexion.html";
  }
</script>
  <header class="header">
  <div class="header-content">
    <a href="eleves.html">← Élèves & classes</a>
    <h1 id="classTitle">Classe</h1>
    <p>Gestion des élèves de cette classe</p>
  </div>
</header>

<main class="container">
  <h2>Élèves</h2>

<div id="studentsList">
  Chargement des élèves...
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const className = params.get("class");

  if (className) {
    document.getElementById("classTitle").textContent = className;
  }
  async function loadStudents() {
  if (!className) {
    document.getElementById("studentsList").textContent =
      "Aucune classe sélectionnée.";
    return;
  }

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?select=Students_code,first_name,last_name,class_name,active&class_name=eq.${encodeURIComponent(className)}&active=eq.true&order=last_name.asc,first_name.asc`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`
      }
    }
  );

  if (!response.ok) {
    document.getElementById("studentsList").textContent =
      "Impossible de charger les élèves.";
    return;
  }

  const students = await response.json();

  if (students.length === 0) {
    document.getElementById("studentsList").textContent =
      "Aucun élève actif dans cette classe.";
    return;
  }

  document.getElementById("studentsList").innerHTML =
    students.map(student =>
  `<div>
  <span>${student.last_name} ${student.first_name} — ${student.Students_code}</span>
  <span class="student-actions">
    <button type="button">✏️ Modifier</button>
    <button type="button">⏸ Désactiver</button>
    <button type="button">🗑 Supprimer</button>
  </span>
</div>`
    ).join("");
}

loadStudents();
</script>
 </main> 
</body>
</html>
