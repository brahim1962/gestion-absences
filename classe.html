<body>
<script>
  const SUPABASE_URL = "https://gtbbrvtpesyumnhyfsrh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LZzN6nKGCPx2c9RLqyZBKA_rhN_mE_3";
  const profAccessToken = sessionStorage.getItem("prof_access_token");
  const profRefreshToken = sessionStorage.getItem("prof_refresh_token");

  if (!profAccessToken || !profRefreshToken) {
    window.location.href = "connexion.html";

</script>
  <header class="header">
  <div class="header-content">
    <a href="eleves.html">← Élèves & classes</a>
    <h1 id="classTitle">Classe</h1>
    <p>Gestion des élèves de cette classe</p>
    <button class="import-button" type="button" onclick="document.getElementById('studentsFileInput').click()">
  📥 Importer des élèves
</button>

<input
  type="file"
  id="studentsFileInput"
  accept=".xlsx,.xls,.csv"
  style="display:none"
>
  </div>
</header>

<main class="container">
  <h2>Élèves</h2>

<div id="studentsList">
  Chargement des élèves...
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const className = params.get("class");

  if (className) {
    document.getElementById("classTitle").textContent = className;
  }
  async function loadStudents() {
  if (!className) {
    document.getElementById("studentsList").textContent =
      "Aucune classe sélectionnée.";
    return;
  }

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?select=id,Students_code,first_name,last_name,class_name,active&class_name=eq.${encodeURIComponent(className)}&order=last_name.asc,first_name.asc`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`
      }
    }
  );

  if (!response.ok) {
    document.getElementById("studentsList").textContent =
      "Impossible de charger les élèves.";
    return;
  }

  const students = await response.json();

  if (students.length === 0) {
    document.getElementById("studentsList").textContent =
      "Aucun élève dans cette classe.";
    return;
  }

  document.getElementById("studentsList").innerHTML =
    students.map(student =>
  `<div class="${student.active ? '' : 'student-disabled'}">
  <span>${student.last_name} ${student.first_name} — ${student.Students_code}</span>
  <span class="student-actions">
    <button type="button" onclick="modifyStudent('${student.Students_code}', '${student.first_name}', '${student.last_name}')">✏️ Modifier</button>
   ${student.active
  ? `<button type="button" onclick="disableStudent('${student.Students_code}', '${student.first_name}', '${student.last_name}')">⏸ Désactiver</button>`
  : `<button type="button" onclick="enableStudent('${student.Students_code}', '${student.first_name}', '${student.last_name}')">▶ Réactiver</button>`
}
   <button type="button" onclick="deleteStudent('${student.Students_code}', '${student.first_name}', '${student.last_name}')">🗑 Supprimer</button>
  </span>
</div>`
    ).join("");
}

 async function modifyStudent(studentCode, firstName, lastName) {
  const newFirstName = prompt("Prénom :", firstName);
  if (newFirstName === null) return;

  const newLastName = prompt("Nom :", lastName);
  if (newLastName === null) return;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?Students_code=eq.${encodeURIComponent(studentCode)}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`,
        "Content-Type": "application/json",
        Prefer: "return=minimal"
      },
      body: JSON.stringify({
        first_name: newFirstName.trim(),
        last_name: newLastName.trim()
      })
    }
  );

  if (!response.ok) {
    alert("Impossible de modifier l’élève.");
    return;
  }

  alert("Élève modifié avec succès.");
  loadStudents();
} 

loadStudents();

async function disableStudent(studentCode, firstName, lastName) {
  const confirmation = confirm(
    `Désactiver l'élève ${lastName} ${firstName} ?`
  );

  if (!confirmation) return;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?Students_code=eq.${encodeURIComponent(studentCode)}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        active: false
      })
    }
  );

  if (!response.ok) {
    alert("Impossible de désactiver l'élève.");
    return;
  }
const updatedStudents = await response.json();

if (updatedStudents.length === 0) {
  alert("Aucun élève trouvé : la désactivation n'a pas été appliquée.");
  return;
}
  alert("Élève désactivé avec succès.");
  loadStudents();
}
  async function enableStudent(studentCode, firstName, lastName) {
  const confirmation = confirm(
    `Réactiver l'élève ${lastName} ${firstName} ?`
  );

  if (!confirmation) return;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?Students_code=eq.${encodeURIComponent(studentCode)}`,
    {
      method: "PATCH",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`,
        "Content-Type": "application/json",
        Prefer: "return=representation"
      },
      body: JSON.stringify({
        active: true
      })
    }
  );

  if (!response.ok) {
    alert("Impossible de réactiver l'élève.");
    return;
  }

  const updatedStudents = await response.json();

  if (updatedStudents.length === 0) {
    alert("Aucun élève trouvé : la réactivation n'a pas été appliquée.");
    return;
  }

  alert("Élève réactivé avec succès.");
  loadStudents();
}
 async function deleteStudent(studentCode, firstName, lastName) {
   const studentResponse = await fetch(
    `${SUPABASE_URL}/rest/v1/students?select=id&Students_code=eq.${encodeURIComponent(studentCode)}`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`
      }
    }
  );

  if (!studentResponse.ok) {
    alert("Impossible de vérifier l'historique de l'élève.");
    return;
  }

  const studentData = await studentResponse.json();

  if (studentData.length === 0) {
    alert("Élève introuvable.");
    return;
  }

  const studentId = studentData[0].id;

  const attendanceResponse = await fetch(
    `${SUPABASE_URL}/rest/v1/attendance?select=id&student_id=eq.${studentId}&limit=1`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`
      }
    }
  );

  if (!attendanceResponse.ok) {
    alert("Impossible de vérifier l'historique des appels.");
    return;
  }

  const attendanceData = await attendanceResponse.json();

  if (attendanceData.length > 0) {
    alert("Cet élève possède déjà un historique d'appel.\n\nIl ne peut pas être supprimé définitivement. Utilisez Désactiver.");
    return;
  }
  const confirmation = confirm(
    `⚠️ SUPPRESSION DÉFINITIVE\n\nSupprimer l'élève ${lastName} ${firstName} ?\n\nCette action est irréversible.`
  );

  if (!confirmation) return;

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?Students_code=eq.${encodeURIComponent(studentCode)}`,
    {
      method: "DELETE",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`,
        Prefer: "return=representation"
      }
    }
  );

  if (!response.ok) {
    alert("Impossible de supprimer l'élève.");
    return;
  }

  const deletedStudents = await response.json();

  if (deletedStudents.length === 0) {
    alert("Aucun élève trouvé : aucune suppression effectuée.");
    return;
  }

  alert("Élève supprimé avec succès.");
  loadStudents();
}
 document.getElementById("studentsFileInput").addEventListener("change", async function(event) {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data);
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    if (rows.length === 0) {
      alert("Le fichier ne contient aucun élève.");
      event.target.value = "";
      return;
    }

    const studentsToImport = [];

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];

      const studentCode = String(row.Students_code || "").trim();
      const firstName = String(row.first_name || "").trim();
      const lastName = String(row.last_name || "").trim();
      const fileClassName = String(row.class_name || "").trim();

      // Ignore les lignes entièrement vides
      if (!studentCode && !firstName && !lastName && !fileClassName) {
        continue;
      }

      if (!studentCode || !firstName || !lastName || !fileClassName) {
        alert(`Ligne ${i + 2} incomplète dans le fichier.`);
        event.target.value = "";
        return;
      }

      if (fileClassName !== className) {
        alert(
          `Classe incorrecte à la ligne ${i + 2}.\n\n` +
          `Classe du fichier : ${fileClassName}\n` +
          `Classe ouverte : ${className}\n\n` +
          `Importation annulée.`
        );
        event.target.value = "";
        return;
      }

      studentsToImport.push({
        Students_code: studentCode,
        first_name: firstName,
        last_name: lastName,
        class_name: fileClassName,
        active: true
      });
    }

    if (studentsToImport.length === 0) {
      alert("Aucun élève valide trouvé dans le fichier.");
      event.target.value = "";
      return;
    }

    const confirmation = confirm(
      `Importer ${studentsToImport.length} élève(s) dans la classe ${className} ?`
    );

    if (!confirmation) {
      event.target.value = "";
      return;
    }

    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/students`,
      {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${profAccessToken}`,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify(studentsToImport)
      }
    );

    if (!response.ok) {
      const errorText = await response.text();
      console.error(errorText);
      alert("Impossible d'importer les élèves.");
      event.target.value = "";
      return;
    }

    const importedStudents = await response.json();

    alert(`${importedStudents.length} élève(s) importé(s) avec succès.`);
    event.target.value = "";
    loadStudents();

  } catch (error) {
    console.error(error);
    alert("Erreur lors de la lecture du fichier.");
    event.target.value = "";
  }
}); 
</script>
 </main>
