<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connexion professeur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8fc;
      color: #0b2d4d;
    }

    header {
      background: #2176b5;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 55px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid #d4e1ec;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .login-card h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #60758a;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #c9d8e5;
      border-radius: 9px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #2176b5;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2176b5;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #185d91;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #2176b5;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Espace professeur</h1>
  <p>Gestion des absences et retards</p>
</header>

<main>

  <div class="login-card">

    <h2>Connexion</h2>

    <div class="subtitle">
      Accès réservé au professeur
    </div>

    <form id="loginForm">

      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Se connecter
      </button>

      <div id="message"></div>

    </form>

    <a class="back" href="index.html">
      ← Retour à l'accueil
    </a>

  </div>

</main>

<script>

  const SUPABASE_URL =
    "https://gtbbrctpesyumnhyfsrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LZzN6nKGCPx2c9RLqyZBKA_rhN_mE_3";

  const loginForm = document.getElementById("loginForm");
  const message = document.getElementById("message");

  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    message.style.color = "#60758a";
    message.textContent = "Connexion en cours...";

    try {

      const response = await fetch(
        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error("Connexion refusée");
      }

      sessionStorage.setItem(
        "prof_access_token",
        data.access_token
      );

      window.location.href = "index.html";

    } catch (error) {

      message.style.color = "#c62828";
      message.textContent =
        "Adresse e-mail ou mot de passe incorrect.";

    }

  });

</script>

</body>
</html>
