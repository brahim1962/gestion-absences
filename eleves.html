<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élèves & classes</title>
  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f8fc;
    color: #18324a;
  }

  .header {
    background: #1769aa;
    color: white;
    padding: 24px 20px;
  }

  .header-content {
    max-width: 900px;
    margin: auto;
   position: relative; 
  }

  .back {
    color: white;
    text-decoration: none;
    font-size: 18px;
  }

  .header h1 {
    margin: 10px 0 4px;
    font-size: 30px;
  }

  .header p {
    margin: 0;
    font-size: 16px;
  }
  .import-button {
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);  
  background: #1769aa;
  color: white;
  border: none;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-bottom: 0;
}

.import-button:hover {
  background: #12558a;
} 
  #classesList {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 15px;
}

.class-card {
  background: white;
  border: 1px solid #d6e2ec;
  border-radius: 10px;
  padding: 14px 22px;
  min-width: 150px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}  
 @media (max-width: 900px) {
  .import-button {
    position: static;
    transform: none;
    display: block;
    margin: 14px 0 0 auto;
    padding: 8px 12px;
    font-size: 14px;
  }
}   
</style>
</head>

<body>
<script>
  const SUPABASE_URL = "https://gtbbrvtpesyumnhyfsrh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_LZzN6nKGCPx2c9RLqyZBKA_rhN_mE_3";
  const profAccessToken = sessionStorage.getItem("prof_access_token");
  const profRefreshToken = sessionStorage.getItem("prof_refresh_token");

  if (!profAccessToken || !profRefreshToken) {
    window.location.href = "connexion.html";
  }
</script>
  <header class="header">
  <div class="header-content">
    <a class="back" href="index.html">←Accueil</a>
    <h1>👥 Élèves & classes</h1>
    <p>Gestion des classes et des listes d’élèves</p>
  <button type="button" class="import-button">
  📥 Importer des élèves
</button>  
  </div>
</header>
<main class="container">
  <section class="classes-section">
    
    <h2>Classes</h2>
    <div id="classesList">
      Chargement des classes...
    </div>
  </section>
</main>
<script>
async function loadClasses() {
  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/students?select=class_name&active=eq.true&order=class_name.asc`,
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${profAccessToken}`
      }
    }
  );

  if (!response.ok) {
    document.getElementById("classesList").textContent =
      "Impossible de charger les classes.";
    return;
  }

  const students = await response.json();

  const classes = [...new Set(
    students.map(student => student.class_name).filter(Boolean)
  )];

  document.getElementById("classesList").innerHTML =
    classes.map(className => `<div class="class-card">${className}</div>`).join("");
}

loadClasses();
</script>  
</body>
</html>
