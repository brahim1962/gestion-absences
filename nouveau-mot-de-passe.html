<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nouveau mot de passe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f8fc;
      color: #0b2d4d;
    }

    header {
      background: #2176b5;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 7px 0 0;
    }

    main {
      min-height: calc(100vh - 120px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 55px 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border: 1px solid #d4e1ec;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .card h2 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #60758a;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #c9d8e5;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #2176b5;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      font-weight: bold;
      min-height: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔐 Espace professeur</h1>
  <p>Gestion des absences et retards</p>
</header>

<main>

  <div class="card">

    <h2>Nouveau mot de passe</h2>

    <div class="subtitle">
      Choisissez votre nouveau mot de passe
    </div>

    <form id="passwordForm">

      <label for="password">Nouveau mot de passe</label>
      <input
        type="password"
        id="password"
        autocomplete="new-password"
        required
      >

      <label for="confirmPassword">
        Confirmer le mot de passe
      </label>

      <input
        type="password"
        id="confirmPassword"
        autocomplete="new-password"
        required
      >

      <button type="submit">
        Enregistrer le nouveau mot de passe
      </button>

      <div id="message"></div>

    </form>

  </div>

</main>

<script>

  const SUPABASE_URL =
    "https://gtbbrvtpesyumnhyfsrh.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LZzN6nKGCPx2c9RLqyZBKA_rhN_mE_3";

  const params =
    new URLSearchParams(window.location.hash.substring(1));

  const accessToken = params.get("access_token");

  const passwordForm =
    document.getElementById("passwordForm");

  const message =
    document.getElementById("message");

  if (!accessToken) {
    message.style.color = "#c62828";
    message.textContent =
      "Lien de récupération invalide ou expiré.";
    passwordForm.querySelector("button").disabled = true;
  }

  passwordForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
      message.style.color = "#c62828";
      message.textContent =
        "Les deux mots de passe sont différents.";
      return;
    }

    message.style.color = "#60758a";
    message.textContent = "Enregistrement en cours...";

    try {

      const response = await fetch(
        `${SUPABASE_URL}/auth/v1/user`,
        {
          method: "PUT",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${accessToken}`
          },

          body: JSON.stringify({
            password: password
          })
        }
      );

      if (!response.ok) {
        throw new Error("Modification refusée");
      }

      message.style.color = "#2e7d32";
      message.textContent =
        "Mot de passe modifié avec succès.";

      setTimeout(function() {
        window.location.href = "connexion.html";
      }, 1500);

    } catch (error) {

      message.style.color = "#c62828";
      message.textContent =
        "Impossible de modifier le mot de passe.";

    }

  });

</script>

</body>
</html>
